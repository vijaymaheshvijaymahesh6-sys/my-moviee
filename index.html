


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Info — Search Posters & Ratings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="movie.css" rel="stylesheet"/>

</head>
<body>
<div class="container py-5">
  <div class="row mb-4">
    <div class="col-12 text-center">
      <h1 class="mb-1">Movie Info</h1>
      <p class="muted mb-0">Search movies, view posters and ratings (OMDb API).</p>
    </div>
  </div>

  <div class="row mb-4 justify-content-center">
    <div class="col-12 col-md-8 search-area p-3 rounded-3">
      <div class="input-group">
        <input id="searchInput" type="search" class="form-control form-control-lg" placeholder="Search for a movie title (e.g. Inception)">
        <button id="searchBtn" class="btn btn-primary btn-lg">Search</button>
      </div>
    </div>
  </div>

  <div class="text-center mb-3" id="loading" style="display:none;">
    <div class="spinner-border text-light" role="status"></div>
    <p class="muted mt-2">Searching...</p>
  </div>

  <div id="results" class="row gy-4"></div>

  <div id="noResults" class="row d-none">
    <div class="col-12 text-center">
      <div class="p-4 border rounded-3 muted">No results found. Try another title.</div>
    </div>
  </div>
</div>

<script src="movie.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
